name: Bowtie
options:
  bundleIdPrefix: app.bowtie
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

packages:
  BowtieKit:
    path: BowtieKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  Bowtie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/iOS
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie
        PRODUCT_NAME: Bowtie
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/iOS/Info.plist
        # SharePlay: needs the Group Activities capability on the app.bowtie
        # App ID (App Store export fails without it). To ship without
        # SharePlay, drop both lines and NSSupportsGroupActivities from
        # App/iOS/Info.plist.
        CODE_SIGN_ENTITLEMENTS: App/iOS/Bowtie.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHAREPLAY"
        INFOPLIST_KEY_CFBundleDisplayName: Bowtie
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LL334G7KP2
    dependencies:
      - package: BowtieKit
    scheme:
      testTargets:
        - SharedTests
        - BowtieUITests

  BowtieTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App/tvOS
      - path: App/Shared
    settings:
      base:
        # Same bundle ID as the iOS app: one App Store Connect record (universal
        # purchase) with an added tvOS platform, so Xcode Cloud can ship both.
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie
        PRODUCT_NAME: BowtieTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/tvOS/Info.plist
        # SharePlay (Group Activities capability on the app.bowtie App ID).
        CODE_SIGN_ENTITLEMENTS: App/tvOS/BowtieTV.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Bowtie
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LL334G7KP2
    dependencies:
      - package: BowtieKit
    scheme:
      testTargets: []

  BowtieMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App/macOS
      - path: App/Shared
    entitlements:
      path: App/macOS/BowtieMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        # Same bundle ID as iOS / tvOS: macOS is added as a platform on the one
        # App Store Connect record (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie
        PRODUCT_NAME: Bowtie
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/macOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Bowtie
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LL334G7KP2
    dependencies:
      - package: BowtieKit
    scheme:
      testTargets: []

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/SharedTests
    dependencies:
      - target: Bowtie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie.SharedTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bowtie.app/Bowtie"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LL334G7KP2

  # Drives the real app against a live server; skipped unless
  # TEST_RUNNER_BOWTIE_UITEST_URL is set (see PlaybackUITests.swift).
  BowtieUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: Bowtie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bowtie
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LL334G7KP2
