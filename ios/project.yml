name: Bowtie
options:
  bundleIdPrefix: app.bowtie
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"

packages:
  BowtieKit:
    path: BowtieKit

settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  Bowtie:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/iOS
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie
        PRODUCT_NAME: Bowtie
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Bowtie
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: BowtieKit
    scheme:
      testTargets: []

  BowtieTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App/tvOS
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bowtie.tv
        PRODUCT_NAME: BowtieTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/tvOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Bowtie
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: BowtieKit
    scheme:
      testTargets: []
