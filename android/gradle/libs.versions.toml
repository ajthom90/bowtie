# Pinned mutually-compatible set (verified 2026-08-05 against official docs):
# - AGP 8.13.2 requires Gradle 8.13 (developer.android.com/build/releases/agp-8-13-0-release-notes)
# - AGP 8.13.2 max API 36.1; Kotlin 2.3 support via R8 8.13.19
# - Kotlin 2.3.21 supports Gradle 7.6.3–9.3.0 and AGP 8.2.2–9.0.0
#   (kotlinlang.org multiplatform compatibility guide)
# - Compose Compiler Gradle plugin version == Kotlin version (2.0+)
# - Compose BOM 2026.06.00 (stable Compose 1.11.x; compileSdk 36 / AGP 8.x)
# Gradle wrapper: 8.13 (recorded in gradle/wrapper/gradle-wrapper.properties)

[versions]
agp = "8.13.2"
kotlin = "2.3.21"
compileSdk = "36"
minSdkApp = "26"
minSdkCore = "25"
targetSdk = "36"

# Compose / AndroidX (must stay within AGP 8.13 / compileSdk 36 AAR metadata)
# core 1.19.0+ requires compileSdk 37 + AGP 9.1; pin 1.18.0 (minCompileSdk 36, AGP 8.9.1)
composeBom = "2026.06.00"
activityCompose = "1.13.0"
# lifecycle 2.11 compose artifacts require compileSdk 37 + AGP 9.1
lifecycle = "2.9.2"
coreKtx = "1.18.0"
datastore = "1.2.1"
securityCrypto = "1.1.0"
media3 = "1.10.1"
# Compose for TV — tv-material 1.1.0 (stable 2026-05-06) depends on Compose 1.10.3;
# BOM 2026.06.00 maps to Compose 1.11.x and overrides those via platform() — forward-compatible.
minSdkTv = "25"
tvMaterial = "1.1.0"

# Network / async / JSON
okhttp = "5.1.0"
coroutines = "1.10.2"
serialization = "1.8.1"

# Desugaring (java.time on API 25)
desugarJdkLibs = "2.1.5"

# Test
junit = "4.13.2"
robolectric = "4.16.1"
turbine = "1.2.0"
androidxTestExt = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
