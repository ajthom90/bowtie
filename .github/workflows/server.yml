name: Server

# Runs only when files this job checks change (or this workflow itself).
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/server.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      # Real-FFmpeg tests: transcode e2e plus the fake-HDHomeRun fault
      # scenarios (internal/e2e/testdata/scenarios). Packages run one at a
      # time and scenarios two at a time: concurrent software transcodes on a
      # 4-vCPU runner make FFmpeg fall behind and trip the ingest stall timer.
      - name: test (ffmpeg + fault scenarios)
        run: go test -tags ffmpeg -p 1 -parallel 2 -timeout 15m ./...
        env:
          CGO_ENABLED: "0"
