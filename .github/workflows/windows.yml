name: Windows

# Runs only when files this job checks change (or this workflow itself).
# Release tags (v*) build through release.yml, which calls this workflow
# (workflow_call) and uploads the packages once GoReleaser has created the
# GitHub Release — so the upload can never race the Release creation.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      WINDOWS_PFX_B64:
        required: false
      WINDOWS_PFX_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # Bowtie.Core is plain .NET 8 (no Windows APIs): build and unit-test it.
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore, build and test Bowtie.Core
        run: |
          dotnet restore Bowtie.Core.Tests/Bowtie.Core.Tests.csproj
          dotnet build Bowtie.Core.Tests/Bowtie.Core.Tests.csproj -c Release --no-restore
          dotnet test Bowtie.Core.Tests/Bowtie.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # WinUI 3 app for x64 and ARM64: signed MSIX bundle + unpackaged zips.
  # Visual Studio's msbuild is required (dotnet build lacks the MSIX/PRI tasks).
  app:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: microsoft/setup-msbuild@v2

      # Tags stamp their version (v0.11.0 → 0.11.0, package 0.11.0.0);
      # other builds are 0.0.<run number>.
      - name: Version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ref = $env:REF_NAME
          if ($env:REF_TYPE -eq "tag" -and $ref -match '^v(\d+)\.(\d+)\.(\d+)([-+][0-9A-Za-z.-]+)?$') {
            $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            $label = $ref.Substring(1)
          } else {
            $version = "0.0.$env:RUN_NUMBER"
            $label = "dev.$env:RUN_NUMBER"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "LABEL=$label" >> $env:GITHUB_ENV
          Write-Host "Version $version, files labelled $label"

      # Signs with the WINDOWS_PFX_B64 / WINDOWS_PFX_PASSWORD secrets when set,
      # otherwise with a self-signed CN=Bowtie certificate made for this build.
      # The matching .cer ships next to the bundle (see windows/README.md).
      - name: Build, package and sign
        shell: pwsh
        env:
          WINDOWS_PFX_B64: ${{ secrets.WINDOWS_PFX_B64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: ./windows/scripts/package.ps1 -Version $env:VERSION -Label $env:LABEL

      - name: Check the bundle
        shell: pwsh
        run: |
          $bundle = "windows/out/dist/bowtie-windows-$env:LABEL.msixbundle"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $bundle))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            $names | Write-Host
            foreach ($arch in @("x64", "ARM64")) {
              if (-not ($names | Where-Object { $_ -like "*_$arch.msix" })) { throw "bundle is missing the $arch package" }
            }
          } finally { $zip.Dispose() }
          # Informational: a self-signed certificate isn't trusted on the runner.
          $sig = Get-AuthenticodeSignature $bundle
          Write-Host "Signature: $($sig.Status) $($sig.StatusMessage)"

      - uses: actions/upload-artifact@v4
        with:
          name: bowtie-windows
          path: windows/out/dist/*
          if-no-files-found: error
          retention-days: 14
