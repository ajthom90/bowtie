name: Android

# Runs only when files this job checks change (or this workflow itself).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # No setup-android: ubuntu-latest ships the SDK (same as release.yml), and
      # setup-android@v3 fails on cmdline-tools 16+ (legacy 'tools' package gone).
      - name: test + assemble debug
        run: ./gradlew :core:test :app:testDebugUnitTest :tv:testDebugUnitTest :app:assembleDebug :tv:assembleDebug
