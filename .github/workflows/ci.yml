name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: server

      - name: test
        run: go test ./...
        env:
          CGO_ENABLED: "0"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: test
        run: npx vitest run

      - name: build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: test + assemble debug
        run: ./gradlew :core:test :app:testDebugUnitTest :tv:testDebugUnitTest :app:assembleDebug :tv:assembleDebug

  # Build the multi-stage image on PRs and main (no push). amd64 only for
  # speed; multi-arch publish happens in the release workflow (Task 21).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: bowtie:ci

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test BowtieKit
        run: swift test --package-path BowtieKit

      - name: Build Bowtie (iOS)
        run: |
          xcodebuild -project Bowtie.xcodeproj -scheme Bowtie \
            -destination 'generic/platform=iOS Simulator' build

      - name: Build BowtieTV (tvOS)
        run: |
          xcodebuild -project Bowtie.xcodeproj -scheme BowtieTV \
            -destination 'generic/platform=tvOS Simulator' build

      # Simulator tests must resolve a UDID at runtime — never hard-code a
      # device name (runner images change default simulators).
      - name: Test SharedTests (iOS Simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for _runtime, devices in data.get('devices', {}).items():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('No available iPhone simulator found')
          ")
          echo "Using iPhone simulator UDID=$UDID"
          xcodebuild -project Bowtie.xcodeproj -scheme Bowtie \
            -destination "id=$UDID" \
            -only-testing:SharedTests \
            test

  roku:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roku
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: roku/package-lock.json

      - name: install
        run: npm ci

      - name: compile
        run: npx bsc

      - name: lint
        run: npx bslint --severity error

      - name: package
        run: npm run package

      - name: assert zip contents
        run: |
          set -euo pipefail
          unzip -l out/bowtie-roku.zip | grep -E "manifest$"
          if unzip -l out/bowtie-roku.zip | grep -E "\.bs$|node_modules"; then
            echo "zip must not contain .bs sources or node_modules" >&2
            exit 1
          fi
          echo ZIP_OK

      - name: upload channel zip
        uses: actions/upload-artifact@v4
        with:
          name: bowtie-roku
          path: roku/out/bowtie-roku.zip
