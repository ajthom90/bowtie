name: iOS

# Runs only when files this job checks change (or this workflow itself).
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  ios:
    runs-on: macos-15
    # Green runs take ~5 min; cap a hung simulator test (seen 2026-10-02).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test BowtieKit
        run: swift test --package-path BowtieKit

      - name: Build Bowtie (iOS)
        run: |
          xcodebuild -project Bowtie.xcodeproj -scheme Bowtie \
            -destination 'generic/platform=iOS Simulator' build

      - name: Build BowtieTV (tvOS)
        run: |
          xcodebuild -project Bowtie.xcodeproj -scheme BowtieTV \
            -destination 'generic/platform=tvOS Simulator' build

      # Ad-hoc signed: the runner has no team certificate.
      - name: Build BowtieMac (macOS)
        run: |
          xcodebuild -project Bowtie.xcodeproj -scheme BowtieMac \
            -destination 'platform=macOS' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build

      # Simulator tests must resolve a UDID at runtime — never hard-code a
      # device name (runner images change default simulators).
      - name: Test SharedTests (iOS Simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for _runtime, devices in data.get('devices', {}).items():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      sys.exit(0)
          sys.exit('No available iPhone simulator found')
          ")
          echo "Using iPhone simulator UDID=$UDID"
          xcodebuild -project Bowtie.xcodeproj -scheme Bowtie \
            -destination "id=$UDID" \
            -only-testing:SharedTests \
            test
