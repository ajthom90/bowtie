openapi: 3.0.3
info:
  title: Bowtie API
  version: 0.1.0
  description: Live TV streaming API for HDHomeRun tuners.
paths:
  /api/v1/auth/login:
    post:
      summary: Log in with username and password
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens plus user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh tokens plus user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked (idempotent)
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/me:
    get:
      summary: Current authenticated user
      operationId: me
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/password:
    post:
      summary: Change the current user's password
      operationId: changePassword
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users:
    get:
      summary: List all users
      operationId: adminListUsers
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a user
      operationId: adminCreateUser
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      summary: Update user role, max quality, and/or password
      operationId: adminPatchUser
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot demote the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a user
      operationId: adminDeleteUser
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/tuners:
    get:
      summary: List HDHomeRun devices with live tuner status
      operationId: adminListTuners
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device status list from last refresh plus live tuner status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/devices:
    post:
      summary: Add a manual HDHomeRun device by IP and sync its lineup
      operationId: adminAddDevice
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceRequest'
      responses:
        '201':
          description: Device validated and stored; lineup synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Device unreachable (discover failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove a known device
      operationId: adminDeleteDevice
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Device deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/channels/sync:
    post:
      summary: Re-fetch lineup.json for every stored device and sync channels
      operationId: adminSyncChannels
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sync attempted for all devices (unreachable devices skipped)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/channels:
    get:
      summary: List all channels with enable/mapping state
      operationId: adminListChannels
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/channels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      summary: Update channel enabled flag and/or EPG mapping
      operationId: adminPatchChannel
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChannelRequest'
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/channels:
    get:
      summary: List enabled channels for the viewer
      operationId: listChannels
      tags: [channels]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enabled channels with optional EPG logo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewerChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    User:
      type: object
      required: [id, username, role, maxQuality]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
          description: Quality profile name, or empty for unlimited
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
          description: Quality profile name, or empty for unlimited
    PatchUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
        password:
          type: string
          format: password
          description: If set, replaces the user's password
    Device:
      type: object
      required: [deviceId, ip, model, tunerCount, manual, lastSeen, streamPort]
      properties:
        deviceId:
          type: string
        ip:
          type: string
          description: Hostname or IP (no port); streamPort used for stream URLs
        model:
          type: string
        tunerCount:
          type: integer
        manual:
          type: boolean
        lastSeen:
          type: string
          format: date-time
        streamPort:
          type: integer
          description: Port for /auto/v* streams (5004 for real devices)
    TunerStatus:
      type: object
      properties:
        resource:
          type: string
        vctNumber:
          type: string
        vctName:
          type: string
        frequency:
          type: integer
          format: int64
        signalStrengthPercent:
          type: integer
        signalQualityPercent:
          type: integer
        symbolQualityPercent:
          type: integer
        targetIp:
          type: string
    DeviceStatus:
      type: object
      required: [device, reachable, tuners]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        reachable:
          type: boolean
        tuners:
          type: array
          items:
            $ref: '#/components/schemas/TunerStatus'
    AddDeviceRequest:
      type: object
      required: [ip]
      properties:
        ip:
          type: string
          description: Device IP, host:port, or http(s) base URL
    AdminChannel:
      type: object
      required: [id, deviceId, guideNumber, name, enabled, epgChannelId]
      properties:
        id:
          type: integer
          format: int64
        deviceId:
          type: string
        guideNumber:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        epgChannelId:
          type: string
          description: Mapped EPG channel id, or empty if unmapped
    PatchChannelRequest:
      type: object
      properties:
        enabled:
          type: boolean
        epgChannelId:
          type: string
    ViewerChannel:
      type: object
      required: [id, guideNumber, name, logoUrl]
      properties:
        id:
          type: integer
          format: int64
        guideNumber:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          description: Icon URL from mapped EPG channel, or empty
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed or missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
