openapi: 3.0.3
info:
  title: Bowtie API
  version: 0.1.0
  description: Live TV streaming API for HDHomeRun tuners.
paths:
  /api/v1/auth/login:
    post:
      summary: Log in with username and password
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens plus user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh tokens plus user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked (idempotent)
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/me:
    get:
      summary: Current authenticated user
      operationId: me
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/password:
    post:
      summary: Change the current user's password
      operationId: changePassword
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users:
    get:
      summary: List all users
      operationId: adminListUsers
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a user
      operationId: adminCreateUser
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      summary: Update user role, max quality, and/or password
      operationId: adminPatchUser
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot demote the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a user
      operationId: adminDeleteUser
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/tuners:
    get:
      summary: List HDHomeRun devices with live tuner status
      operationId: adminListTuners
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device status list from last refresh plus live tuner status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/devices:
    post:
      summary: Add a manual HDHomeRun device by IP and sync its lineup
      operationId: adminAddDevice
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDeviceRequest'
      responses:
        '201':
          description: Device validated and stored; lineup synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Device unreachable (discover failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove a known device
      operationId: adminDeleteDevice
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Device deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/channels/sync:
    post:
      summary: Re-fetch lineup.json for every stored device and sync channels
      operationId: adminSyncChannels
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sync attempted for all devices (unreachable devices skipped)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/channels:
    get:
      summary: List all channels with enable/mapping state
      operationId: adminListChannels
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/channels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      summary: Update channel enabled flag and/or EPG mapping
      operationId: adminPatchChannel
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchChannelRequest'
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/channels:
    get:
      summary: List enabled channels for the viewer
      operationId: listChannels
      tags: [channels]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enabled channels with optional EPG logo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewerChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/guide:
    get:
      summary: TV guide for enabled channels in a time window
      operationId: getGuide
      tags: [guide]
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: false
          description: Window start (RFC3339). Defaults to now (UTC).
          schema:
            type: string
            format: date-time
        - name: stop
          in: query
          required: false
          description: Window stop (RFC3339). Defaults to now+4h. Span must not exceed 24h.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Enabled channels with programmes overlapping the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuideChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Time span exceeds 24 hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/epg/status:
    get:
      summary: EPG source status (configured, last success/error, stale)
      operationId: adminEPGStatus
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status of XMLTV and Schedules Direct sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EPGSourceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/epg/refresh:
    post:
      summary: Trigger an immediate EPG refresh for all configured sources
      operationId: adminEPGRefresh
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Refresh started in the background
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/epg/channels:
    get:
      summary: List EPG channels available for mapping
      operationId: adminEPGChannels
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All EPG channels from imported sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EPGChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/epg/lineups:
    get:
      summary: List Schedules Direct lineups on the configured account
      description: |
        Requires SD username+password in settings. Error contract for the UI:
        - 422 when credentials are not configured
        - 401 when Schedules Direct rejects the credentials (auth-class:
          apiError code 4003/INVALID_USER, or Token() rejection including
          HTTP 200 with nonzero code)
        - 502 when Schedules Direct is unreachable (transport/timeouts/5xx)
        Secrets are never echoed in error bodies.
      operationId: adminEPGLineups
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account lineup list from Schedules Direct GET /lineups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SDLineupSummary'
        '401':
          description: Missing auth, or Schedules Direct rejected credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Schedules Direct credentials not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Schedules Direct is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/settings:
    get:
      summary: Product settings (XMLTV, Schedules Direct, transcode)
      description: |
        Returns the runtime settings provider state. Schedules Direct password
        is never returned; use `passwordConfigured` instead. Transcode
        `available` / `hevcCapable` come from the injected FFmpeg probe.
      operationId: adminGetSettings
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Update product settings (section merge)
      description: |
        Explicit section merge: each top-level section (`xmltv`,
        `schedulesDirect`, `transcode`) is optional; a nil/omitted section is
        left untouched. Within a present section every field is required,
        except `schedulesDirect.password` — absent or empty keeps the existing
        password. Clearing Schedules Direct entirely: submit `schedulesDirect`
        with an empty `username` (username, password, and lineupId are all
        cleared).

        Validation runs for ALL present sections before any write; all keys
        are applied in a single store transaction (no partial application).

        Validation rules:
        - `xmltv.refreshHours` 1–168
        - `xmltv.source` empty (disabled), http(s) URL, or absolute path
        - `transcode.encoder` `"auto"` or a probed-available backend
      operationId: adminPutSettings
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSettingsRequest'
      responses:
        '200':
          description: Settings after apply (same shape as GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/transcode:
    get:
      summary: Encoder probe status (available backends, HEVC support, selected)
      description: |
        Returns the cached FFmpeg probe plus the currently selected backend.
        `selected` is resolved from the runtime settings provider
        (`transcode.encoder`, Admin → Settings) — the same source of truth used
        when starting stream sessions — not a boot-time config snapshot.
      operationId: adminTranscode
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cached FFmpeg encoder probe result with runtime-selected backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sessions:
    post:
      summary: Start or join a shared HLS stream session for a channel
      description: |
        Starts or joins a shared HLS transcode session for the given channel.

        **Admin preview of disabled channels:** when the caller's role is
        `admin`, a session may be started for a channel that is not enabled
        (Admin → Channels ▶ Preview smoke test). Viewers always receive 404
        for disabled channels. The enabled check runs before session-key join,
        so viewers cannot attach to an admin's disabled-channel session.
      operationId: createSession
      tags: [stream]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Viewer handle and signed playlist URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Unknown channel, or disabled channel for a non-admin caller.
            Admins may start sessions on disabled channels (preview).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Codec/profile negotiation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            All tuners in use. The `sessions` array is filtered by role:
            non-admin callers only receive sessions whose channel is currently
            enabled (so admin previews of unlisted channels do not leak names);
            admins receive all live sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunersBusyError'
  /api/v1/sessions/{viewerId}:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Stop a viewer (Bearer JWT or valid stream token)
      operationId: deleteSession
      tags: [stream]
      parameters:
        - name: token
          in: query
          required: false
          description: Signed stream token (alternative to Bearer auth)
          schema:
            type: string
      responses:
        '204':
          description: Viewer stopped (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions/{viewerId}/heartbeat:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Heartbeat a viewer (Bearer JWT or valid stream token)
      description: |
        Touches the viewer's last-seen timestamp so the reaper does not drop
        idle clients (viewerIdleTimeout is 90s). Clients SHOULD send the stream
        token (query param) rather than Bearer — the stream token never rotates
        mid-session and avoids racing access-token refresh. Auth mirrors DELETE.
      operationId: heartbeatSession
      tags: [stream]
      parameters:
        - name: token
          in: query
          required: false
          description: Signed stream token (preferred alternative to Bearer auth)
          schema:
            type: string
      responses:
        '204':
          description: Viewer touched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stream/{viewerId}/index.m3u8:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: true
        description: Signed stream token for this viewer
        schema:
          type: string
    get:
      summary: HLS media playlist (rewritten segment URLs; heartbeats viewer)
      operationId: getPlaylist
      tags: [stream]
      responses:
        '200':
          description: application/vnd.apple.mpegurl playlist
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stream/{viewerId}/{segment}:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
      - name: segment
        in: path
        required: true
        description: Segment filename matching seg#####.ts
        schema:
          type: string
          pattern: '^seg\d{5}\.ts$'
      - name: token
        in: query
        required: true
        schema:
          type: string
    get:
      summary: HLS MPEG-TS segment
      operationId: getSegment
      tags: [stream]
      responses:
        '200':
          description: video/mp2t segment
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/sessions:
    get:
      summary: List live stream sessions
      operationId: adminListSessions
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions with viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Force-terminate a stream session
      operationId: adminTerminateSession
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session terminated (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    User:
      type: object
      required: [id, username, role, maxQuality]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
          description: Quality profile name, or empty for unlimited
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
          description: Quality profile name, or empty for unlimited
    PatchUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
        password:
          type: string
          format: password
          description: If set, replaces the user's password
    Device:
      type: object
      required: [deviceId, ip, model, tunerCount, manual, lastSeen, streamPort]
      properties:
        deviceId:
          type: string
        ip:
          type: string
          description: Hostname or IP (no port); streamPort used for stream URLs
        model:
          type: string
        tunerCount:
          type: integer
        manual:
          type: boolean
        lastSeen:
          type: string
          format: date-time
        streamPort:
          type: integer
          description: Port for /auto/v* streams (5004 for real devices)
    TunerStatus:
      type: object
      properties:
        resource:
          type: string
        vctNumber:
          type: string
        vctName:
          type: string
        frequency:
          type: integer
          format: int64
        signalStrengthPercent:
          type: integer
        signalQualityPercent:
          type: integer
        symbolQualityPercent:
          type: integer
        targetIp:
          type: string
    DeviceStatus:
      type: object
      required: [device, reachable, tuners]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        reachable:
          type: boolean
        tuners:
          type: array
          items:
            $ref: '#/components/schemas/TunerStatus'
    AddDeviceRequest:
      type: object
      required: [ip]
      properties:
        ip:
          type: string
          description: Device IP, host:port, or http(s) base URL
    AdminChannel:
      type: object
      required: [id, deviceId, guideNumber, name, enabled, epgChannelId]
      properties:
        id:
          type: integer
          format: int64
        deviceId:
          type: string
        guideNumber:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        epgChannelId:
          type: string
          description: Mapped EPG channel id, or empty if unmapped
    PatchChannelRequest:
      type: object
      properties:
        enabled:
          type: boolean
        epgChannelId:
          type: string
    ViewerChannel:
      type: object
      required: [id, guideNumber, name, logoUrl]
      properties:
        id:
          type: integer
          format: int64
        guideNumber:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          description: Icon URL from mapped EPG channel, or empty
    GuideChannel:
      type: object
      required: [channelId, guideNumber, name, logoUrl, programs]
      properties:
        channelId:
          type: integer
          format: int64
        guideNumber:
          type: string
        name:
          type: string
        logoUrl:
          type: string
        programs:
          type: array
          items:
            $ref: '#/components/schemas/GuideProgram'
    GuideProgram:
      type: object
      required: [start, stop, title, subtitle, description, category]
      properties:
        start:
          type: string
          format: date-time
        stop:
          type: string
          format: date-time
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        category:
          type: string
    EPGSourceStatus:
      type: object
      required: [xmltv, sd]
      properties:
        xmltv:
          $ref: '#/components/schemas/EPGSourceState'
        sd:
          $ref: '#/components/schemas/EPGSourceState'
    EPGSourceState:
      type: object
      required: [configured, lastSuccess, lastError, stale]
      properties:
        configured:
          type: boolean
        lastSuccess:
          type: string
          format: date-time
          description: RFC3339; zero time when never succeeded
        lastError:
          type: string
          description: Empty when last refresh succeeded
        stale:
          type: boolean
          description: True when configured and lastSuccess is older than 2× refresh interval
    EPGChannel:
      type: object
      required: [id, displayName, callsign, iconUrl, source]
      properties:
        id:
          type: string
        displayName:
          type: string
        callsign:
          type: string
        iconUrl:
          type: string
        source:
          type: string
          enum: [xmltv, sd]
    TranscodeStatus:
      type: object
      required: [available, hevc, ffmpegVersion, selected]
      properties:
        available:
          type: array
          items:
            type: string
          description: Encoder backends discovered at startup
        hevc:
          type: object
          additionalProperties:
            type: boolean
          description: Map of backend name → HEVC support
        ffmpegVersion:
          type: string
        selected:
          type: string
          description: Backend chosen for config.encoder (auto or forced)
    Settings:
      type: object
      required: [xmltv, schedulesDirect, transcode]
      properties:
        xmltv:
          $ref: '#/components/schemas/SettingsXMLTV'
        schedulesDirect:
          $ref: '#/components/schemas/SettingsSchedulesDirect'
        transcode:
          $ref: '#/components/schemas/SettingsTranscode'
    SettingsXMLTV:
      type: object
      required: [source, refreshHours]
      properties:
        source:
          type: string
          description: Empty disables XMLTV; otherwise http(s) URL or absolute path
        refreshHours:
          type: integer
          minimum: 1
          maximum: 168
    SettingsSchedulesDirect:
      type: object
      required: [username, passwordConfigured, lineupId]
      properties:
        username:
          type: string
        passwordConfigured:
          type: boolean
          description: True when a password is stored; the password itself is never returned
        lineupId:
          type: string
    SettingsTranscode:
      type: object
      required: [encoder, allowHevc, available, hevcCapable]
      properties:
        encoder:
          type: string
          description: Preference ("auto" or a backend name)
        allowHevc:
          type: boolean
        available:
          type: array
          items:
            type: string
          description: Probed encoder backends (same source as GET /admin/transcode)
        hevcCapable:
          type: object
          additionalProperties:
            type: boolean
          description: Map of backend name → HEVC support
    PutSettingsRequest:
      type: object
      description: |
        Section-merge body. Omit a section to leave it unchanged. Within a
        present section all fields are required except schedulesDirect.password.
      properties:
        xmltv:
          $ref: '#/components/schemas/PutSettingsXMLTV'
        schedulesDirect:
          $ref: '#/components/schemas/PutSettingsSchedulesDirect'
        transcode:
          $ref: '#/components/schemas/PutSettingsTranscode'
    PutSettingsXMLTV:
      type: object
      required: [source, refreshHours]
      properties:
        source:
          type: string
        refreshHours:
          type: integer
          minimum: 1
          maximum: 168
    PutSettingsSchedulesDirect:
      type: object
      required: [username, lineupId]
      properties:
        username:
          type: string
          description: Empty clears username, password, and lineupId
        password:
          type: string
          description: Absent or empty keeps the existing password
        lineupId:
          type: string
    PutSettingsTranscode:
      type: object
      required: [encoder, allowHevc]
      properties:
        encoder:
          type: string
        allowHevc:
          type: boolean
    SDLineupSummary:
      type: object
      required: [lineupId, name, location, transport]
      properties:
        lineupId:
          type: string
          description: Schedules Direct lineup id (wire key "lineup")
        name:
          type: string
        location:
          type: string
        transport:
          type: string
          description: e.g. Antenna, Cable, Satellite, DVB-T
    ClientCaps:
      type: object
      properties:
        videoCodecs:
          type: array
          items:
            type: string
          description: e.g. h264, hevc, av1
        audioCodecs:
          type: array
          items:
            type: string
          description: e.g. aac, ac3, eac3
        maxHeight:
          type: integer
          description: 0 = no limit
        profile:
          type: string
          description: Quality ladder name; empty defaults to original
    CreateSessionRequest:
      type: object
      required: [channelId, caps]
      properties:
        channelId:
          type: integer
          format: int64
        caps:
          $ref: '#/components/schemas/ClientCaps'
    CreateSessionResponse:
      type: object
      required: [viewerId, playlistUrl, session]
      properties:
        viewerId:
          type: string
        playlistUrl:
          type: string
          description: Path to index.m3u8 with signed token query param
        session:
          $ref: '#/components/schemas/CreateSessionSessionInfo'
    CreateSessionSessionInfo:
      type: object
      description: Negotiated session fields for client stats overlay
      required: [videoCodec, profile, backend, channelName]
      properties:
        videoCodec:
          type: string
          example: h264
        profile:
          type: string
          example: high
        backend:
          type: string
          example: videotoolbox
        channelName:
          type: string
          example: WABC
    ViewerInfo:
      type: object
      required: [id, username, lastSeen]
      properties:
        id:
          type: string
        username:
          type: string
        lastSeen:
          type: string
          format: date-time
    SessionInfo:
      type: object
      required: [id, channelId, channelName, key, videoCodec, profile, backend, viewers, startedAt]
      properties:
        id:
          type: string
        channelId:
          type: integer
          format: int64
        channelName:
          type: string
        key:
          type: string
        videoCodec:
          type: string
        profile:
          type: string
        backend:
          type: string
        viewers:
          type: array
          items:
            $ref: '#/components/schemas/ViewerInfo'
        startedAt:
          type: string
          format: date-time
    TunersBusyError:
      type: object
      required: [error, sessions]
      description: |
        Returned when no tuner is free. For non-admin callers, `sessions`
        includes only sessions on enabled channels; admins see all sessions.
      properties:
        error:
          type: string
          example: all tuners in use
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed or missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
