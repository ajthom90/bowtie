  /api/v1/admin/epg/lineups:
    get:
      summary: List Schedules Direct lineups on the configured account
      description: |
        Requires SD username+password in settings. Error contract for the UI:
        - 422 when credentials are not configured
        - 401 when Schedules Direct rejects the credentials (auth-class:
          apiError code 4003/INVALID_USER, or Token() rejection including
          HTTP 200 with nonzero code)
        - 502 when Schedules Direct is unreachable (transport/timeouts/5xx)
        Secrets are never echoed in error bodies.
      operationId: adminEPGLineups
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account lineup list from Schedules Direct GET /lineups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SDLineupSummary'
        '401':
          description: Missing auth, or Schedules Direct rejected credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Schedules Direct credentials not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Schedules Direct is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/backup:
    get:
      summary: Download a database backup
      description: |
        A consistent snapshot of the SQLite database (accounts, channels,
        guide, recording list, rules and settings — not the recorded video).
        It contains password hashes and the Schedules Direct password, so
        store it safely. Token-signing secrets and refresh tokens are removed.
        Restore: stop Bowtie, replace `bowtie.db` in the data directory with
        the file (removing any `-journal`/`-wal` file), start Bowtie; everyone
        signs in again.
      operationId: adminBackup
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SQLite database file (attachment)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Snapshot failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/settings:
    get:
      summary: Product settings (XMLTV, Schedules Direct, transcode)
      description: |
        Returns the runtime settings provider state. Schedules Direct password
        is never returned; use `passwordConfigured` instead. Transcode
        `available` / `hevcCapable` come from the injected FFmpeg probe.
      operationId: adminGetSettings
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Update product settings (section merge)
      description: |
        Explicit section merge: each top-level section (`xmltv`,
        `schedulesDirect`, `transcode`) is optional; a nil/omitted section is
        left untouched. Within a present section every field is required,
        except `schedulesDirect.password` — absent or empty keeps the existing
        password. Clearing Schedules Direct entirely: submit `schedulesDirect`
        with an empty `username` (username, password, and lineupId are all
        cleared).

        Validation runs for ALL present sections before any write; all keys
        are applied in a single store transaction (no partial application).

        Validation rules:
        - `xmltv.refreshHours` 1–168
        - `xmltv.source` empty (disabled), http(s) URL, or absolute path
        - `transcode.encoder` `"auto"` or a probed-available backend
        - `dvr.padStartSeconds` 0–1800 and `dvr.padEndSeconds` 0–3600 (both
          required when `dvr` is present)
        - `dvr.quality` `"720p"` or `"1080p"` (optional; absent keeps the
          stored value)
        - `notifications.url` empty (off) or an http(s) URL (required when
          `notifications` is present); `notifications.events` and each event
          are optional (absent keeps the stored choice)
      operationId: adminPutSettings
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSettingsRequest'
      responses:
        '200':
          description: Settings after apply (same shape as GET)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/notifications/test:
    post:
      summary: Send a test notification
      description: |
        Sends "Bowtie test notification" to `url` from the body, or to the
        saved `notifications.url` when the body (or its `url`) is absent, and
        reports how the target answered. The event choices and rate limit
        don't apply. One attempt, 5 s timeout, no retry. A failed delivery is
        still `200` with `ok: false`; `error` never contains the URL's path,
        query or credentials.
      operationId: adminTestNotification
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Try this URL instead of the saved one (not saved)
      responses:
        '200':
          description: Delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/transcode:
    get:
      summary: Encoder probe status (available backends, HEVC support, selected)
      description: |
        Returns the cached FFmpeg probe plus the currently selected backend.
        `selected` is resolved from the runtime settings provider
        (`transcode.encoder`, Admin → Settings) — the same source of truth used
        when starting stream sessions — not a boot-time config snapshot.
      operationId: adminTranscode
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cached FFmpeg encoder probe result with runtime-selected backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/dvr/storage:
    get:
      summary: Recording disk use and counts
      description: |
        Disk space where recordings live (`totalBytes`/`freeBytes` from the
        filesystem), what recordings use (`usedBytes`: ready recordings plus
        files of in-progress ones; cached for up to 30 s), and recording
        counts. New captures don't start while `freeBytes` < `floorBytes`;
        the retention sweep deletes the oldest unprotected recordings while
        `freeBytes` < `minFreeBytes` (0 = off).
      operationId: adminDVRStorage
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DVRStorage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Recording is not available on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/sessions:
    post:
      summary: Start or join a shared HLS stream session for a channel
      description: |
        Starts or joins a shared HLS transcode session for the given channel.

        **Admin preview of disabled channels:** when the caller's role is
        `admin`, a session may be started for a channel that is not enabled
        (Admin → Channels ▶ Preview smoke test). Viewers always receive 404
        for disabled channels. The enabled check runs before session-key join,
        so viewers cannot attach to an admin's disabled-channel session.
      operationId: createSession
      tags: [stream]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: Viewer handle and signed playlist URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Unknown channel, or disabled channel for a non-admin caller.
            Admins may start sessions on disabled channels (preview).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Codec/profile negotiation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            All tuners in use. The `sessions` array is filtered by role:
            non-admin callers only receive sessions whose channel is currently
            enabled (so admin previews of unlisted channels do not leak names);
            admins receive all live sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunersBusyError'
        '403':
          description: |
            Parental controls block this channel, or the program on now
            (`{"error": "Blocked by parental controls (rated TV-MA)", "code": "parental"}`).
            A playing viewer stopped later for the same reason gets this
            from its heartbeat and playlist requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            The caller's account limit would be exceeded (see User.maxStreams
            and User.maxTuners). `error` is a message to show the viewer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLimitError'
        '500':
          description: |
            The session could not be started. `error` is "failed to start
            session"; for admins it is followed by ": <cause>" (the same cause
            is always logged on the server).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            The tuner could not receive the channel (HDHomeRun 806 Tune Failed
            or 807 No Video Data): weak or no signal. `error` is "no signal on
            this channel", followed by ": <cause>" for admins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/sessions/{viewerId}:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Stop a viewer (Bearer JWT or valid stream token)
      operationId: deleteSession
      tags: [stream]
      parameters:
        - name: token
          in: query
          required: false
          description: Signed stream token (alternative to Bearer auth)
          schema:
            type: string
      responses:
        '204':
          description: Viewer stopped (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions/{viewerId}/heartbeat:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Heartbeat a viewer (Bearer JWT or valid stream token)
      description: |
        Touches the viewer's last-seen timestamp so the reaper does not drop
        idle clients (viewerIdleTimeout is 90s). Clients SHOULD send the stream
        token (query param) rather than Bearer — the stream token never rotates
        mid-session and avoids racing access-token refresh. Auth mirrors DELETE.
      operationId: heartbeatSession
      tags: [stream]
      parameters:
        - name: token
          in: query
          required: false
          description: Signed stream token (preferred alternative to Bearer auth)
          schema:
            type: string
      responses:
        '204':
          description: Viewer touched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stream/{viewerId}/index.m3u8:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: true
        description: Signed stream token for this viewer
        schema:
          type: string
    get:
      summary: HLS master playlist for this viewer (heartbeats viewer)
      description: |
        Rebuilt on every fetch from the session's layout: one variant per
        video rung at or below the viewer's quality ceiling (720p or the top
        rung first), each listed once per audio group (AAC stereo, and AC-3 5.1
        when the broadcast has it), plus an "English CC" WebVTT rendition once
        its playlist exists. Every URI carries the stream token.
      operationId: getPlaylist
      tags: [stream]
      responses:
        '200':
          description: application/vnd.apple.mpegurl playlist
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stream/{viewerId}/{segment}:
    parameters:
      - name: viewerId
        in: path
        required: true
        schema:
          type: string
      - name: segment
        in: path
        required: true
        description: |
          A session file: rendition playlist (v<height>.m3u8, v<height>_vtt.m3u8,
          aac<i>.m3u8, ac3<i>.m3u8 — fetching one heartbeats the viewer), MPEG-TS
          segment (<rendition>_#####.ts) or WebVTT segment (v<height><n>.vtt,
          served with an X-TIMESTAMP-MAP header). Other names return 400.
        schema:
          type: string
          pattern: '^((v\d{3,4}|v\d{3,4}_vtt|aac[0-2]|ac3[0-2])\.m3u8|(v\d{3,4}|aac[0-2]|ac3[0-2])_\d{5}\.ts|v\d{3,4}\d+\.vtt)$'
      - name: token
        in: query
        required: true
        schema:
          type: string
    get:
      summary: HLS rendition playlist or segment
      operationId: getSegment
      tags: [stream]
      responses:
        '200':
          description: Rendition playlist, MPEG-TS segment or WebVTT segment
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
            text/vtt:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/sessions:
    get:
      summary: List live stream sessions
      operationId: adminListSessions
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active sessions with viewers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Force-terminate a stream session
      operationId: adminTerminateSession
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session terminated (idempotent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    User:
      type: object
      required: [id, username, role, maxQuality, maxStreams, maxTuners, allowedChannelIds, maxRating, blockUnrated]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
          description: Quality profile name, or empty for unlimited
        maxStreams:
          type: integer
          minimum: 0
          maximum: 8
          description: Concurrent streams allowed (0 = no limit; admins are never limited)
        maxTuners:
          type: integer
          minimum: 0
          maximum: 8
          description: |
            Tuners the account may occupy alone (0 = no limit). Watching a
            channel another account is already watching costs no tuner.
        allowedChannelIds:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: Parental controls — channels this account may see and watch (null = every channel; admins are never restricted)
        maxRating:
          type: string
          enum: ['', TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA]
          description: Parental controls — highest rating that plays ("" = no limit). Movie ratings map onto the same ladder (G, PG, PG-13, R).
        blockUnrated:
          type: boolean
          description: Parental controls — also block programs without a rating (including channels with no guide data)
    UserLimitError:
      type: object
      required: [error, code, kind, limit]
      properties:
        error:
          type: string
          example: Your account can use 1 tuner at a time. Stop another channel first.
        code:
          type: string
          enum: [user_limit]
        kind:
          type: string
          enum: [streams, tuners]
        limit:
          type: integer
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
          description: Quality profile name, or empty for unlimited
        maxStreams:
          type: integer
          minimum: 0
          maximum: 8
          description: Concurrent streams allowed (0 = no limit; admins are never limited)
        maxTuners:
          type: integer
          minimum: 0
          maximum: 8
          description: |
            Tuners the account may occupy alone (0 = no limit). Watching a
            channel another account is already watching costs no tuner.
        allowedChannelIds:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: Parental controls — channels this account may see and watch (null = every channel; admins are never restricted)
        maxRating:
          type: string
          enum: ['', TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA]
          description: Parental controls — highest rating that plays ("" = no limit). Movie ratings map onto the same ladder (G, PG, PG-13, R).
        blockUnrated:
          type: boolean
          description: Parental controls — also block programs without a rating (including channels with no guide data)
    PatchUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, viewer]
        maxQuality:
          type: string
        maxStreams:
          type: integer
          minimum: 0
          maximum: 8
          description: Concurrent streams allowed (0 = no limit; admins are never limited)
        maxTuners:
          type: integer
          minimum: 0
          maximum: 8
          description: |
            Tuners the account may occupy alone (0 = no limit). Watching a
            channel another account is already watching costs no tuner.
        password:
          type: string
          format: password
          description: If set, replaces the user's password
        allowedChannelIds:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
          description: Parental controls — channels this account may see and watch (null = every channel; admins are never restricted)
        maxRating:
          type: string
          enum: ['', TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA]
          description: Parental controls — highest rating that plays ("" = no limit). Movie ratings map onto the same ladder (G, PG, PG-13, R).
        blockUnrated:
          type: boolean
          description: Parental controls — also block programs without a rating (including channels with no guide data)
    Device:
      type: object
      required: [deviceId, ip, model, tunerCount, manual, lastSeen, streamPort]
      properties:
        deviceId:
          type: string
        ip:
          type: string
          description: Hostname or IP (no port); streamPort used for stream URLs
        model:
          type: string
        tunerCount:
          type: integer
        manual:
          type: boolean
        lastSeen:
          type: string
          format: date-time
        streamPort:
          type: integer
          description: Port for /auto/v* streams (5004 for real devices)
    TunerStatus:
      type: object
      properties:
        resource:
          type: string
        vctNumber:
          type: string
        vctName:
          type: string
        frequency:
          type: integer
          format: int64
        signalStrengthPercent:
          type: integer
        signalQualityPercent:
          type: integer
        symbolQualityPercent:
          type: integer
        targetIp:
          type: string
    DeviceStatus:
      type: object
      required: [device, reachable, tuners]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        reachable:
          type: boolean
        tuners:
          type: array
          items:
            $ref: '#/components/schemas/TunerStatus'
    AdminTunersResponse:
      type: object
      required: [devices, ingestChannels]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatus'
        ingestChannels:
          type: array
          items:
            type: integer
            format: int64
          description: Channel IDs with an open device ingest (including the 5s post-last-Close tail)
    AddDeviceRequest:
      type: object
      required: [ip]
      properties:
        ip:
          type: string
          description: Device IP, host:port, or http(s) base URL
    AdminChannel:
      type: object
      required: [id, deviceId, guideNumber, name, enabled, epgChannelId]
      properties:
        id:
          type: integer
          format: int64
        deviceId:
          type: string
        guideNumber:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        epgChannelId:
          type: string
          description: Mapped EPG channel id, or empty if unmapped
    PatchChannelRequest:
      type: object
      properties:
        enabled:
          type: boolean
        epgChannelId:
          type: string
    RecordingRule:
      type: object
      required: [id, title, seriesId, channelId, channelName, newOnly, keepLatest, scheduledBy, canManage, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        seriesId:
          type: string
        channelId:
          type: integer
          format: int64
          description: 0 = any channel
        channelName:
          type: string
        newOnly:
          type: boolean
        keepLatest:
          type: integer
        scheduledBy:
          type: string
        canManage:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Recording:
      type: object
      required: [id, title, subtitle, description, category, channelId, channelName, start, stop, state, partial, failure, failureDetail, durationSec, sizeBytes, protected, positionSec, scheduledBy, canManage]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        category:
          type: string
        channelId:
          type: integer
          format: int64
        channelName:
          type: string
        start:
          type: string
          format: date-time
        stop:
          type: string
          format: date-time
        state:
          type: string
          enum: [scheduled, waiting, recording, converting, ready, failed]
          description: waiting = inside its window, retrying for a free tuner
        partial:
          type: boolean
          description: More than a minute is missing (late start, dropped stream, or a restart)
        failure:
          type: string
          enum: ['', noTuner, noSignal, diskFull, error, skipped]
        failureDetail:
          type: string
        durationSec:
          type: integer
        sizeBytes:
          type: integer
          format: int64
        protected:
          type: boolean
          description: Never deleted automatically when space runs low
        positionSec:
          type: integer
          description: The caller's resume position
        scheduledBy:
          type: string
        canManage:
          type: boolean
          description: The caller may stop, delete or protect it (scheduler or admin)
        rating:
          type: string
          description: The program's rating when scheduled ("" = not rated)
        ruleId:
          type: integer
          format: int64
          description: Series rule that scheduled it (0 = one-off)
        locked:
          type: boolean
          description: Parental controls block it for the caller (no description; play is 403)
        commercials:
          type: array
          description: >-
            Commercial breaks found by commercial detection (Comskip, when the
            server has it), as offsets in seconds on the recording's playback
            (HLS VOD) timeline; sorted and non-overlapping. Omitted when none
            were found, detection hasn't run yet, or it isn't available.
          items:
            $ref: '#/components/schemas/CommercialBreak'
    CommercialBreak:
      type: object
      required: [start, end]
      properties:
        start:
          type: number
          format: double
          description: Seconds from the start of playback
        end:
          type: number
          format: double
          description: Seconds from the start of playback (after start)
    RecentChannel:
      type: object
      required: [channelId, guideNumber, name, logoUrl, watchedAt]
      properties:
        channelId:
          type: integer
          format: int64
        guideNumber:
          type: string
        name:
          type: string
        logoUrl:
          type: string
        watchedAt:
          type: string
          format: date-time
    ViewerChannel:
      type: object
      required: [id, guideNumber, name, logoUrl, reception, favorite]
      properties:
        favorite:
          type: boolean
          description: The caller has starred this channel
        id:
          type: integer
          format: int64
        guideNumber:
          type: string
        name:
          type: string
        logoUrl:
          type: string
          description: Icon URL from mapped EPG channel, or empty
        reception:
          type: string
          enum: [ok, noSignal, unknown]
          description: |
            The channel's last tune outcome, learned from real tunes (the
            HDHomeRun reports signal only for a channel it is tuned to).
            "noSignal" means the tuner last answered 806/807; "unknown" means
            not tuned since the server started.
        receptionCheckedAt:
          type: string
          format: date-time
          description: When reception was last learned; absent when unknown.
    GuideChannel:
      type: object
      required: [channelId, guideNumber, name, logoUrl, programs, reception, favorite]
      properties:
        favorite:
          type: boolean
          description: The caller has starred this channel
        channelId:
          type: integer
          format: int64
        guideNumber:
          type: string
        name:
          type: string
        logoUrl:
          type: string
        reception:
          type: string
          enum: [ok, noSignal, unknown]
          description: Same as ViewerChannel.reception.
        receptionCheckedAt:
          type: string
          format: date-time
          description: Same as ViewerChannel.receptionCheckedAt.
        programs:
          type: array
          items:
            $ref: '#/components/schemas/GuideProgram'
    GuideProgram:
      type: object
      required: [start, stop, title, subtitle, description, category]
      properties:
        programId:
          type: string
          description: Guide program ID of the episode (when the source has one)
        seriesId:
          type: string
          description: Series ID of the show (when the source has one)
        isNew:
          type: boolean
          description: First airing
        rating:
          type: string
          description: Rating from the guide source (e.g. TV-14; "" = not rated)
        locked:
          type: boolean
          description: Parental controls block this program for the caller (description is hidden)
        recording:
          type: object
          description: Present when this program is scheduled or recorded
          required: [id, state]
          properties:
            id:
              type: integer
              format: int64
            state:
              type: string
        start:
          type: string
          format: date-time
        stop:
          type: string
          format: date-time
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        category:
          type: string
    EPGSourceStatus:
      type: object
      required: [xmltv, sd, hdhomerun]
      properties:
        xmltv:
          $ref: '#/components/schemas/EPGSourceState'
        sd:
          $ref: '#/components/schemas/EPGSourceState'
        hdhomerun:
          allOf:
            - $ref: '#/components/schemas/EPGSourceState'
          description: |
            Free guide from SiliconDust's HDHomeRun XMLTV API. configured is
            true when the hdhomerun.enabled setting is on and at least one
            tuner is known. Refreshes every 20-28 h at a random time.
    EPGSourceState:
      type: object
      required: [configured, lastSuccess, lastError, stale]
      properties:
        configured:
          type: boolean
        lastSuccess:
          type: string
          format: date-time
          description: RFC3339; zero time when never succeeded
        lastError:
          type: string
          description: Empty when last refresh succeeded
        stale:
          type: boolean
          description: True when configured and lastSuccess is older than 2× refresh interval
    EPGChannel:
      type: object
      required: [id, displayName, callsign, iconUrl, source]
      properties:
        id:
          type: string
        displayName:
          type: string
        callsign:
          type: string
        iconUrl:
          type: string
        source:
          type: string
          enum: [xmltv, sd, hdhomerun]
          description: hdhomerun channel ids are prefixed "hdhomerun:"
    TranscodeStatus:
      type: object
      required: [available, hevc, ffmpegVersion, selected]
      properties:
        available:
          type: array
          items:
            type: string
          description: Encoder backends discovered at startup
        hevc:
          type: object
          additionalProperties:
            type: boolean
          description: Map of backend name → HEVC support
        ffmpegVersion:
          type: string
        selected:
          type: string
          description: Backend chosen for config.encoder (auto or forced)
    Settings:
      type: object
      # streaming is always returned by GET but is optional in the schema so
      # older clients that omit it on PUT continue to type-check; required only
      # the v0.4.0 sections. OpenAPI delta (v0.5.0): add streaming, NOT to required.
      required: [xmltv, schedulesDirect, transcode]
      properties:
        xmltv:
          $ref: '#/components/schemas/SettingsXMLTV'
        schedulesDirect:
          $ref: '#/components/schemas/SettingsSchedulesDirect'
        transcode:
          $ref: '#/components/schemas/SettingsTranscode'
        streaming:
          $ref: '#/components/schemas/SettingsStreaming'
        hdhomerun:
          $ref: '#/components/schemas/SettingsHDHomeRun'
        dvr:
          $ref: '#/components/schemas/SettingsDVR'
        notifications:
          $ref: '#/components/schemas/SettingsNotifications'
    SettingsNotifications:
      type: object
      required: [url, events]
      description: |
        Admin notifications. Delivery follows the URL: a host containing
        "ntfy" (ntfy.sh or self-hosted) gets an ntfy message (plain-text body
        with `Title`, `Priority` and `Tags` headers; `https://user:pass@host/topic`
        sends Basic auth); `discord.com`/`discordapp.com` `/api/webhooks/...`
        gets Discord JSON `{"content": "**title**\nmessage"}`; anything else
        gets a JSON POST `{event, title, message, recordingId?, time}` (time
        RFC 3339). 5 s timeout, one retry after 30 s on no answer, 429 or
        5xx. The same event is sent at most once per 6 hours (a failed
        recording once per recording).
      properties:
        url:
          type: string
          description: Empty turns notifications off; otherwise an http(s) URL
        events:
          $ref: '#/components/schemas/SettingsNotificationEvents'
    SettingsNotificationEvents:
      type: object
      required: [recordingFailed, diskLow, recordingReady, guideFailed]
      properties:
        recordingFailed:
          type: boolean
          description: A recording failed (not a skipped episode). Default true.
        diskLow:
          type: boolean
          description: |
            Free space for recordings is below the capture floor or the
            retention target after the hourly sweep. Default true.
        recordingReady:
          type: boolean
          description: A recording finished converting. Default false.
        guideFailed:
          type: boolean
          description: |
            A guide source has failed for more than 24 hours straight.
            Default true.
    PutSettingsNotifications:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Empty turns notifications off; otherwise an http(s) URL
        events:
          type: object
          description: Each event is optional; absent keeps the stored choice.
          properties:
            recordingFailed:
              type: boolean
            diskLow:
              type: boolean
            recordingReady:
              type: boolean
            guideFailed:
              type: boolean
    NotificationTestResult:
      type: object
      required: [target, ok]
      properties:
        target:
          type: string
          enum: [ntfy, discord, webhook]
          description: How the message was formatted
        ok:
          type: boolean
          description: The target answered 2xx
        status:
          type: integer
          description: HTTP status the target answered (absent when it didn't answer)
        error:
          type: string
          description: What went wrong (host only; never the URL's path or credentials)
    SettingsDVR:
      type: object
      required: [padStartSeconds, padEndSeconds]
      properties:
        padStartSeconds:
          type: integer
          minimum: 0
          maximum: 1800
          description: |
            Start recording this many seconds before the show. Default 60.
            Applies to recordings scheduled afterwards.
        padEndSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: |
            Keep recording this many seconds after the show. Default 180.
            Applies to recordings scheduled afterwards.
        quality:
          type: string
          enum: ['720p', '1080p']
          description: |
            Resolution finished recordings are converted to (H.264 HLS).
            `720p` (default): 720p at about 4 Mb/s (~1.7 GiB per hour).
            `1080p`: keeps 1080i broadcasts at 1920x1080, deinterlaced, at
            about 8 Mb/s (~3.4 GiB per hour); 720p broadcasts stay 720p at
            about 6 Mb/s. Read when a recording is converted, so it applies to
            recordings converted afterwards; the master playlist advertises
            each recording's resolution. Optional in PUT (absent keeps the
            stored value); absent in GET on older servers.
    DVRStorage:
      type: object
      required: [dir, usedBytes, freeBytes, totalBytes, floorBytes, minFreeBytes, recordings]
      properties:
        dir:
          type: string
          description: Recordings directory
        usedBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        floorBytes:
          type: integer
          format: int64
          description: Below this much free space a new capture doesn't start
        minFreeBytes:
          type: integer
          format: int64
          description: The retention sweep frees space below this (0 = off)
        recordings:
          type: object
          required: [ready, scheduled, recording, failed]
          description: |
            scheduled includes recordings waiting for a tuner; recording
            includes converting; failed leaves out skipped series episodes.
          properties:
            ready:
              type: integer
            scheduled:
              type: integer
            recording:
              type: integer
            failed:
              type: integer
    SettingsHDHomeRun:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: |
            Fetch the free TV guide from SiliconDust's HDHomeRun XMLTV API
            (no account needed) and map unmapped channels to it by guide
            number. Existing mappings are never changed. Default true.
    SettingsXMLTV:
      type: object
      required: [source, refreshHours]
      properties:
        source:
          type: string
          description: Empty disables XMLTV; otherwise http(s) URL or absolute path
        refreshHours:
          type: integer
          minimum: 1
          maximum: 168
    SettingsSchedulesDirect:
      type: object
      required: [username, passwordConfigured, lineupId]
      properties:
        username:
          type: string
        passwordConfigured:
          type: boolean
          description: True when a password is stored; the password itself is never returned
        lineupId:
          type: string
    SettingsTranscode:
      type: object
      required: [encoder, allowHevc, available, hevcCapable]
      properties:
        encoder:
          type: string
          description: Preference ("auto" or a backend name)
        allowHevc:
          type: boolean
        available:
          type: array
          items:
            type: string
          description: Probed encoder backends (same source as GET /admin/transcode)
        hevcCapable:
          type: object
          additionalProperties:
            type: boolean
          description: Map of backend name → HEVC support
    SettingsStreaming:
      type: object
      required: [bufferMinutes, adaptive]
      properties:
        bufferMinutes:
          type: integer
          minimum: 2
          maximum: 60
          description: |
            Live pause/rewind buffer length in minutes. Default 15.
            FFmpeg -hls_list_size = bufferMinutes*60/4 (4s segments).
            Read at session start; not live-mutable mid-session.
        adaptive:
          type: boolean
          description: |
            One shared multi-quality transcode per channel (1080/720/480/360,
            never above the broadcast); every viewer of a channel shares it and
            players pick the quality. More GPU. Off: one stream per quality.
            Default false. Applies to new sessions.
    PutSettingsRequest:
      type: object
      description: |
        Section-merge body. Omit a section to leave it unchanged. Within a
        present section all fields are required except schedulesDirect.password.
        streaming is optional (omit = leave bufferMinutes unchanged).
      properties:
        xmltv:
          $ref: '#/components/schemas/PutSettingsXMLTV'
        schedulesDirect:
          $ref: '#/components/schemas/PutSettingsSchedulesDirect'
        transcode:
          $ref: '#/components/schemas/PutSettingsTranscode'
        streaming:
          $ref: '#/components/schemas/PutSettingsStreaming'
        hdhomerun:
          $ref: '#/components/schemas/SettingsHDHomeRun'
        dvr:
          $ref: '#/components/schemas/SettingsDVR'
        notifications:
          $ref: '#/components/schemas/PutSettingsNotifications'
    PutSettingsXMLTV:
      type: object
      required: [source, refreshHours]
      properties:
        source:
          type: string
        refreshHours:
          type: integer
          minimum: 1
          maximum: 168
    PutSettingsSchedulesDirect:
      type: object
      required: [username, lineupId]
      properties:
        username:
          type: string
          description: Empty clears username, password, and lineupId
        password:
          type: string
          description: Absent or empty keeps the existing password
        lineupId:
          type: string
    PutSettingsTranscode:
      type: object
      required: [encoder, allowHevc]
      properties:
        encoder:
          type: string
        allowHevc:
          type: boolean
    PutSettingsStreaming:
      type: object
      required: [bufferMinutes]
      properties:
        bufferMinutes:
          type: integer
          minimum: 2
          maximum: 60
        adaptive:
          type: boolean
          description: Optional; omit to keep the stored value.
    SDLineupSummary:
      type: object
      required: [lineupId, name, location, transport]
      properties:
        lineupId:
          type: string
          description: Schedules Direct lineup id (wire key "lineup")
        name:
          type: string
        location:
          type: string
        transport:
          type: string
          description: e.g. Antenna, Cable, Satellite, DVB-T
    ClientCaps:
      type: object
      properties:
        videoCodecs:
          type: array
          items:
            type: string
          description: e.g. h264, hevc, av1
        audioCodecs:
          type: array
          items:
            type: string
          description: e.g. aac, ac3, eac3
        maxHeight:
          type: integer
          description: 0 = no limit
        profile:
          type: string
          description: Quality ladder name; empty defaults to original
    CreateSessionRequest:
      type: object
      required: [channelId, caps]
      properties:
        channelId:
          type: integer
          format: int64
        caps:
          $ref: '#/components/schemas/ClientCaps'
        joinSessionId:
          type: string
          description: |
            SharePlay: join this existing session (the sharer's `session.id`)
            so every participant plays the same playlist. If it is gone, on
            another channel, or in a codec the client can't play, a normal
            session starts instead. Account limits apply either way.
    CreateSessionResponse:
      type: object
      required: [viewerId, playlistUrl, session]
      properties:
        viewerId:
          type: string
        playlistUrl:
          type: string
          description: Path to index.m3u8 with signed token query param
        session:
          $ref: '#/components/schemas/CreateSessionSessionInfo'
    CreateSessionSessionInfo:
      type: object
      description: Negotiated session fields for client stats overlay
      required: [videoCodec, profile, backend, channelName]
      properties:
        id:
          type: string
          description: Server session ID (shared by everyone watching the same stream)
        videoCodec:
          type: string
          example: h264
        profile:
          type: string
          example: high
        backend:
          type: string
          example: videotoolbox
        channelName:
          type: string
          example: WABC
    ViewerInfo:
      type: object
      required: [id, username, lastSeen]
      properties:
        id:
          type: string
        username:
          type: string
        lastSeen:
          type: string
          format: date-time
    SessionInfo:
      type: object
      required: [id, channelId, channelName, key, videoCodec, profile, backend, viewers, startedAt]
      properties:
        id:
          type: string
        channelId:
          type: integer
          format: int64
        channelName:
          type: string
        key:
          type: string
        videoCodec:
          type: string
        profile:
          type: string
        backend:
          type: string
        viewers:
          type: array
          items:
            $ref: '#/components/schemas/ViewerInfo'
        startedAt:
          type: string
          format: date-time
    TunersBusyError:
      type: object
      required: [error, sessions]
      description: |
        Returned when no tuner is free. For non-admin callers, `sessions`
        includes only sessions on enabled channels; admins see all sessions.
      properties:
        error:
          type: string
          example: all tuners in use
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
        otherInUse:
          type: integer
          description: |
            Tuners busy for something other than Bowtie (for example Plex):
            tuners the HDHomeRun reports streaming minus the ones Bowtie's own
            streams hold.
  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication failed or missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted (e.g. non-admin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
