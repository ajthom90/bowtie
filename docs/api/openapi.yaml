openapi: 3.0.3
info:
  title: Bowtie API
  version: 0.1.0
  description: Live TV streaming API for HDHomeRun tuners.
paths:
  /api/v1/version:
    get:
      summary: Running server version
      operationId: getVersion
      tags: [meta]
      responses:
        '200':
          description: Release version of the running server
          content:
            application/json:
              schema:
                type: object
                required: [version, serverId, serverName]
                properties:
                  version:
                    type: string
                    example: 0.5.3
                  serverId:
                    type: string
                    description: Stable random ID of this server (same whatever URL a client uses)
                  serverName:
                    type: string
                    description: BOWTIE_SERVER_NAME, or the host name
  /api/v1/auth/login:
    post:
      summary: Log in with username and password
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and refresh tokens plus user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      operationId: refresh
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh tokens plus user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      summary: Revoke a refresh token
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked (idempotent)
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/me:
    get:
      summary: Current authenticated user
      operationId: me
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/device:
    post:
      summary: Start a quick sign-in (TV apps)
      description: |
        The TV shows `userCode` and a QR code of `verifyUrl` (the web app's
        /link page). A signed-in phone or browser approves it; the TV polls
        /auth/device/token every `interval` seconds until it gets tokens.
      operationId: deviceStart
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceName:
                  type: string
                  description: Shown to the approver ("Living room Apple TV")
      responses:
        '200':
          description: Codes
          content:
            application/json:
              schema:
                type: object
                required: [deviceCode, userCode, verifyUrl, expiresIn, interval]
                properties:
                  deviceCode:
                    type: string
                    description: Secret; only the TV knows it
                  userCode:
                    type: string
                    example: BCDF-2345
                  verifyUrl:
                    type: string
                  qrUrl:
                    type: string
                    description: Server-relative PNG of verifyUrl as a QR code (for TV apps)
                  expiresIn:
                    type: integer
                  interval:
                    type: integer
        '429':
          description: Too many sign-ins in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/device/qr/{file}:
    parameters:
      - name: file
        in: path
        required: true
        description: <userCode>.png
        schema:
          type: string
    get:
      summary: QR code image of a quick sign-in's verify URL
      operationId: deviceQR
      tags: [auth]
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/device/token:
    post:
      summary: Poll for a quick sign-in's tokens (TV apps)
      operationId: deviceToken
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode:
                  type: string
      responses:
        '200':
          description: Approved (one use)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '410':
          description: Expired, used or unknown (`{"error":"expired_token"}`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: Not approved yet (`{"error":"authorization_pending"}`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/device/{userCode}:
    parameters:
      - name: userCode
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Look up a quick sign-in code before approving it
      operationId: deviceLookup
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The device asking
          content:
            application/json:
              schema:
                type: object
                required: [deviceName]
                properties:
                  deviceName:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/device/approve:
    post:
      summary: Approve a quick sign-in; the device signs in as the caller
      operationId: deviceApprove
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userCode]
              properties:
                userCode:
                  type: string
      responses:
        '204':
          description: Approved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/password:
    post:
      summary: Change the current user's password
      operationId: changePassword
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/favorites/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      summary: Star a channel for the current user
      operationId: addFavorite
      tags: [me]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Starred (idempotent)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown or disabled channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Unstar a channel for the current user
      operationId: removeFavorite
      tags: [me]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Unstarred (idempotent)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/recents:
    get:
      summary: Channels the current user watched recently
      description: |
        Newest first; enabled channels only. A channel is recorded after 30 s
        of watching, so zapping through doesn't add it.
      operationId: listRecents
      tags: [me]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: Recently watched channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Clear the current user's watch history
      operationId: clearRecents
      tags: [me]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/guide/search:
    get:
      summary: Search upcoming and on-now programs
      description: |
        Programs that haven't ended, on enabled channels, whose title, episode
        title or description contains `q` (case-insensitive). Title matches
        first, then by start time. `recording` is set when the program is
        scheduled or recorded.
      operationId: searchGuide
      tags: [guide]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Matching programs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [channelId, guideNumber, channelName, logoUrl, start, stop, title, subtitle, description, category]
                  properties:
                    channelId:
                      type: integer
                      format: int64
                    guideNumber:
                      type: string
                    channelName:
                      type: string
                    logoUrl:
                      type: string
                    start:
                      type: string
                      format: date-time
                    stop:
                      type: string
                      format: date-time
                    title:
                      type: string
                    subtitle:
                      type: string
                    description:
                      type: string
                    category:
                      type: string
                    rating:
                      type: string
                    locked:
                      type: boolean
                    recording:
                      type: object
                      required: [id, state]
                      properties:
                        id:
                          type: integer
                          format: int64
                        state:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/recording-rules:
    get:
      summary: List series recording rules (everyone's)
      operationId: listRecordingRules
      tags: [dvr]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordingRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Record a show (every new episode) from a guide program
      description: |
        Matches the program's series (or, without a series ID from the
        guide, its exact title). Default: the program's channel only, new
        episodes only. Upcoming matches (14 days) are scheduled at once and
        again whenever the guide refreshes; an episode already recorded or
        scheduled isn't scheduled twice, and deleting an upcoming episode
        skips it.
      operationId: createRecordingRule
      tags: [dvr]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, programStart]
              properties:
                channelId:
                  type: integer
                  format: int64
                programStart:
                  type: string
                  format: date-time
                anyChannel:
                  type: boolean
                  description: Record the show on any channel
                newOnly:
                  type: boolean
                  default: true
                keepLatest:
                  type: integer
                  minimum: 0
                  description: Keep only this many recordings of the show (0 = all; Keep-marked ones don't count)
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                required: [rule, scheduled]
                properties:
                  rule:
                    $ref: '#/components/schemas/RecordingRule'
                  scheduled:
                    type: integer
                    description: Upcoming airings scheduled now
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recording-rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      summary: Stop recording a show (cancels its upcoming recordings; recorded ones stay)
      operationId: deleteRecordingRule
      tags: [dvr]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recordings:
    get:
      summary: List recordings (everyone's)
      operationId: listRecordings
      tags: [dvr]
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          description: upcoming (scheduled/waiting/recording, oldest first), recorded (converting/ready, newest first) or failed (newest first). Omit for all.
          schema:
            type: string
            enum: [upcoming, recorded, failed]
      responses:
        '200':
          description: Recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recording'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Schedule a recording
      description: |
        Either a guide program (`channelId` + `programStart`, the program's
        exact start) or a manual window (`channelId` + `start` + `stop`,
        optional `title`). Capture starts 1 min early and ends 3 min late.
        Overlapping recordings on the same channel share a tuner; more
        distinct channels than tuners is a 409 unless `force`.
      operationId: createRecording
      tags: [dvr]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId:
                  type: integer
                  format: int64
                programStart:
                  type: string
                  format: date-time
                start:
                  type: string
                  format: date-time
                stop:
                  type: string
                  format: date-time
                title:
                  type: string
                force:
                  type: boolean
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema:
                type: object
                required: [recording, warnings]
                properties:
                  recording:
                    $ref: '#/components/schemas/Recording'
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code:
                          type: string
                          enum: [usesAllTuners]
                        message:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown/disabled channel, or no such program in the guide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Tuner conflict
          content:
            application/json:
              schema:
                type: object
                required: [error, tunerCount, conflicts]
                properties:
                  error:
                    type: string
                  tunerCount:
                    type: integer
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recording'
        '503':
          description: Recording is not available on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      summary: Keep (protect) a recording from automatic deletion
      operationId: patchRecording
      tags: [dvr]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                protected:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Cancel a scheduled recording, or delete a recording and its files
      operationId: deleteRecording
      tags: [dvr]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recordings/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Stop a recording now and keep what was recorded
      operationId: stopRecording
      tags: [dvr]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Stopping
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The recording isn't in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recordings/{id}/commercials/detect:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Find commercial breaks again (admin)
      description: |
        Clears a ready recording's breaks and queues commercial detection
        (say after editing comskip.ini). A run already in progress finishes.
      operationId: redetectCommercials
      tags: [dvr]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Queued
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Detection isn't available, or the recording isn't ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/recordings/{id}/play:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      summary: Get a playback URL for a ready recording
      operationId: playRecording
      tags: [dvr]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: HLS VOD URL (token-signed) and the caller's resume position
          content:
            application/json:
              schema:
                type: object
                required: [playlistUrl, positionSec, durationSec]
                properties:
                  playlistUrl:
                    type: string
                  positionSec:
                    type: integer
                  durationSec:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Parental controls block this recording (`code` is `parental`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Not ready to play yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/recordings/{id}/position:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      summary: Save the caller's resume position
      operationId: setRecordingPosition
      tags: [dvr]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec]
              properties:
                positionSec:
                  type: integer
                  minimum: 0
      responses:
        '204':
          description: Saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recordings/{id}/hls/{file}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: file
        in: path
        required: true
        schema:
          type: string
          pattern: '^(index|v\d{3,4}|aac\d)(\.m3u8|_\d{5}\.ts)$'
      - name: token
        in: query
        required: true
        schema:
          type: string
    get:
      summary: A recording's HLS VOD files (token from /play; no bearer)
      operationId: getRecordingFile
      tags: [dvr]
      responses:
        '200':
          description: Playlist (URIs carry the token) or MPEG-TS segment
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/me/feed:
    post:
      summary: Create (or rotate) the caller's IPTV feed key
      description: |
        Returns M3U and XMLTV URLs for apps that can't sign in — Kodi
        (including on Xbox), VLC, TiviMate, Plex, Jellyfin, Channels. The key
        is in the URL; anyone with it watches as this account (limits and
        parental controls apply). A new key replaces the old one.
      operationId: createFeed
      tags: [iptv]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Feed URLs
          content:
            application/json:
              schema:
                type: object
                required: [key, m3uUrl, xmltvUrl]
                properties:
                  key:
                    type: string
                  m3uUrl:
                    type: string
                  xmltvUrl:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Turn the caller's IPTV feed off
      operationId: deleteFeed
      tags: [iptv]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Off
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/iptv/{key}/playlist.m3u:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      summary: M3U playlist of the feed account's channels
      operationId: iptvPlaylist
      tags: [iptv]
      responses:
        '200':
          description: Extended M3U (tvg-id matches guide.xml channel ids)
          content:
            audio/x-mpegurl:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/iptv/{key}/guide.xml:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      summary: XMLTV guide (next 72 hours) for the feed account's channels
      operationId: iptvGuide
      tags: [iptv]
      responses:
        '200':
          description: XMLTV document
          content:
            application/xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/iptv/{key}/stream/{channelId}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: channelId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: quality
        in: query
        schema:
          type: string
          enum: [original, high, medium, low]
    get:
