# Bowtie — local / home-lab deployment
#
#   cd deploy && docker compose up -d
#   docker compose logs -f   # first-run admin password is printed once
#
# Image is published by the release workflow as ghcr.io/ajthom90/bowtie:latest.
# To build from a local checkout instead, uncomment the `build:` block.
#
# Product settings (XMLTV / Schedules Direct / encoder / HEVC) are configured in
# Admin → Settings (DB-backed, restart-free). Env and config.yaml keys for those
# are FIRST-BOOT SEEDS only — once present in the DB, UI wins and survives
# restarts. Infra-only keys still apply every start (data dir, devices, listen).

services:
  bowtie:
    image: ghcr.io/ajthom90/bowtie:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    ports:
      - "8400:8400"
    volumes:
      # Persistent state: SQLite, config.yaml, JWT secrets, etc.
      - bowtie-data:/data
    # HLS segments are short-lived and high-churn. Keep them on tmpfs so they
    # never hit the data volume, avoid SSD wear, and disappear on container
    # restart (sessions recreate segments from the live tuner stream).
    # Buffer window (Admin → Settings → streaming.bufferMinutes, default 15):
    #   hls_list_size = bufferMinutes × 60 / 4  (4s segments)
    #   ≈ 60 MB/min/session at top profile → 15 min ≈ 900 MB/session;
    #   2 concurrent ≈ 1.8 GB. size=4g leaves headroom for multi-session and
    #   longer buffers (up to 60 min).
    tmpfs:
      - /data/segments:size=4g
    # Intel Quick Sync / VAAPI: expose the GPU render nodes so FFmpeg can use
    # h264_qsv / h264_vaapi. Harmless on machines without /dev/dri (drivers
    # simply are not selected by the encoder probe).
    devices:
      - /dev/dri:/dev/dri
    # HDHomeRun discovery uses UDP broadcast on port 65001. Bridge networking
    # cannot receive those broadcasts, so either:
    #   (a) set network_mode: host (comment ports: when you do — host mode
    #       publishes 8400 on the host directly), or
    #   (b) leave bridge mode and add devices by IP via Admin → Tuners or
    #       BOWTIE_DEVICES (first-boot / device-table seed).
    # network_mode: host
    restart: unless-stopped
    environment:
      # Infra (always honored):
      BOWTIE_DATA_DIR: /data
      # BOWTIE_DEVICES: 192.168.1.50   # optional tuner IP seed
      # Product settings — first-boot seeds only (Admin → Settings is control plane):
      # BOWTIE_ENCODER: auto          # auto|qsv|vaapi|nvenc|software|videotoolbox

volumes:
  bowtie-data:
