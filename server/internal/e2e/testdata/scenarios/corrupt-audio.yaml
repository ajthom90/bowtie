name: corrupt-audio
duration: 35s
timeline:
  - {at: 10s, fault: corrupt, type: tei, rate: 0.01, for: 10s}
bowtie: {layout: production}  # AAC and the live AC-3 re-encode are both probed
expect:
  minSegmentsAfterFault: 3
  maxTailGapSeconds: 12
  noFetchErrors: true
  sessionSurvives: true
  sequenceMonotonic: true
  maxFfmpegRestarts: 0
  maxAudioHoleMs: 50
