name: baseline-1080i
source: synthetic-1080i
duration: 30s
expect:
  sequenceMonotonic: true
  maxGapSeconds: 10
  sessionSurvives: true
  maxFfmpegRestarts: 0
  # No faults injected, yet on a loaded host FFmpeg falls behind while ramping
  # up on 1080i, the ingest stall timer force-closes its subscription (2s full
  # channel), and Bowtie restarts FFmpeg: ~1 in 3 runs alone, most runs at
  # -parallel 3. Same code path as slow-consumer-restart; suspected production
  # freeze trigger. Make strict again once Plan 2 lands.
  flaky: "ingest stall force-close restarts FFmpeg when it falls behind on 1080i ramp-up (Plan 2)"
